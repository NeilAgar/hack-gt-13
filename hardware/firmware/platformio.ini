; Call Clock firmware. See hardware/README.md for the quickstart.
;   pio run -e esp32dev -t upload       flash the default board (ESP32 DevKit v1 / WROOM-32)
;   pio run -e esp32-s3-devkitc-1       build for the S3 board
;   pio test -e native                  run the state-machine + hash-chain tests on the laptop
;   pio run -e nano -t upload           flash an Arduino Nano (ATmega328; `nano-oldboot` for most clones)
;   pio device monitor                  watch EVT / DBG lines (115200 baud)

[platformio]
default_envs = esp32dev

[esp32_common]
platform = espressif32@^6.9.0
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.filesystem = littlefs
build_flags = -std=gnu++17 -Wall
build_unflags = -std=gnu++11
build_src_filter = +<*> -<main_nano.cpp> -<compact_log.cpp> -<timefmt.cpp>
lib_deps =
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit GFX Library@^1.11.11
    bblanchon/ArduinoJson@^7.2.1
    adafruit/Adafruit NeoPixel@^1.12.3

[env:esp32dev]
extends = esp32_common
board = esp32dev

[env:esp32-s3-devkitc-1]
extends = esp32_common
board = esp32-s3-devkitc-1
; USB CDC on boot so Serial works over the S3's native USB port as well as the UART bridge.
build_flags = ${esp32_common.build_flags} -DARDUINO_USB_CDC_ON_BOOT=1

; Arduino Nano (ATmega328P, 16 MHz): no Wi-Fi, no OLED, no filesystem. Events are signed exactly like the
; ESP32's and the last ~57 are kept in EEPROM. See the Nano section of hardware/firmware/include/config.h.
[nano_common]
platform = atmelavr@^5.1.0
framework = arduino
monitor_speed = 115200
build_flags = -std=gnu++17 -Wall
build_unflags = -std=gnu++11
build_src_filter = +<*> -<main.cpp> -<net.cpp>
lib_ldf_mode = chain+
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.3

[env:nano]
; Genuine Nano / "new bootloader" (uploads at 115200)
extends = nano_common
board = nanoatmega328new

[env:nano-oldboot]
; Most clones ship the old bootloader (uploads at 57600). Use this if upload says "not in sync".
extends = nano_common
board = nanoatmega328

[env:native]
; Laptop-only unit tests: the pure modules (no Arduino headers) plus the portable SHA-256.
platform = native
test_framework = unity
test_build_src = yes
build_flags = -std=gnu++17 -Wall -DCALLCLOCK_NATIVE
build_src_filter = -<*> +<call_clock.cpp> +<event_log.cpp> +<light_sensor.cpp> +<crypto.cpp> +<sha256_portable.cpp> +<compact_log.cpp> +<timefmt.cpp>
